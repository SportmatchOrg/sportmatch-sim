name: Corrida de usuarios simulados

# Cada 6 h, a las 00:10, 06:10, 12:10 y 18:10 de Argentina (UTC−3 → 03:10, 09:10, 15:10, 21:10 UTC).
# Claude usa la suscripción de quien generó CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
# Si la corrida falla (por ejemplo, sin límite de uso), avisa en Discord.

on:
  schedule:
    - cron: '10 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: Tope de personas en esta corrida
        default: '12'

permissions:
  contents: write

concurrency:
  group: simular
  cancel-in-progress: false

jobs:
  corrida:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Escribir .env
        env:
          API_URL: ${{ vars.API_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: printf 'API_URL=%s\nFIREBASE_API_KEY=%s\nBOT_PASSWORD=%s\n' "$API_URL" "$FIREBASE_API_KEY" "$BOT_PASSWORD" > .env

      - name: Corrida
        id: corrida
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAX: ${{ inputs.max || '12' }}
        run: |
          claude -p "Hacé una corrida según CLAUDE.md. Usá \`hoy --max $MAX\`." \
            --model sonnet \
            --max-turns 150 \
            --output-format json \
            --permission-mode acceptEdits \
            --allowedTools "Bash(node src/cli.ts:*)" "Bash(node src/create-bots.ts:*)" Read Glob \
            > corrida.json
          node .github/scripts/resultado.mjs corrida.json

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "sportmatch-sim"
          git config user.email "sportmatch-sim@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "Sin cambios en state/."
            exit 0
          fi
          git commit -m "sim: corrida $(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d %H:%M')"
          for intento in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          exit 1

      - name: Avisar en Discord si falló
        if: steps.corrida.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/avisar-discord.mjs corrida.json

      - name: Marcar el job como fallido
        if: steps.corrida.outcome == 'failure'
        run: exit 1
